version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: datapilot-postgres
    restart: always
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot_secret
      POSTGRES_DB: datapilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: datapilot-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: datapilot-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://datapilot:datapilot_secret@postgres:5432/datapilot
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-datapilot_super_secret_jwt_key_change_in_production_32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-datapilot_aes256_secret_key_32bytes_long!!}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ./data/sandboxes:/app/data/sandboxes

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: datapilot-web
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
